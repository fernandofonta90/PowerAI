# Banco de preguntas doradas — Torre OTC (CU-00 a CU-07).
#
# Cada entrada se evalúa en dos niveles (ver evals/README.md):
#   - motor:  ejecuta `sql_canonico` por el motor M3 y compara contra `asercion`.
#   - agente: la `pregunta` (y sus `variantes`) entra por el agente M4 completo.
#
# Las respuestas son correctas POR CONSTRUCCIÓN del dataset de referencia
# (app/evals/dataset.py). Los montos DECIMAL se serializan como string.
# El usuario es solo-MX: la cartera de CO del dataset nunca debe aparecer (RLS).

- id: otc-aging-total
  cu: CU-00
  pregunta: "¿Cuál es el monto total de la cartera por cobrar abierta?"
  variantes:
    - "¿Cuánto suma en total la cartera abierta?"
    - "Dame el total de las facturas abiertas"
  usuario: uploader.mx@powerai.dev
  respondible: true
  sql_canonico: "SELECT sum(monto) AS total FROM ar_abiertas"
  asercion:
    filas: [["99091.50"]]

- id: otc-aging-num-facturas
  cu: CU-00
  pregunta: "¿Cuántas facturas abiertas hay?"
  variantes:
    - "¿Cuántas facturas por cobrar siguen abiertas?"
  usuario: uploader.mx@powerai.dev
  respondible: true
  sql_canonico: "SELECT count(*) AS n FROM ar_abiertas"
  asercion:
    filas: [[23]]

- id: otc-saldo-por-cliente
  cu: CU-03b
  pregunta: "¿Cuál es el saldo abierto por cliente, de mayor a menor?"
  variantes:
    - "Muéstrame la deuda de cada cliente ordenada de mayor a menor"
  usuario: uploader.mx@powerai.dev
  respondible: true
  sql_canonico: "SELECT cliente, sum(monto) AS saldo FROM ar_abiertas GROUP BY cliente ORDER BY saldo DESC"
  asercion:
    filas:
      - ["GLOBEX", "20000.00"]
      - ["STARK", "15000.00"]
