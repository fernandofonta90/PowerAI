      - ["WAYNE", "9700.00"]
      - ["MASSIVE", "9100.00"]
      - ["GEKKO", "7250.00"]
      - ["HOOLI", "6800.00"]
      - ["INITECH", "6300.75"]
      - ["ACME", "5950.50"]
      - ["VEHEMENT", "4450.00"]
      - ["SOYLENT", "2750.00"]
      - ["WONKA", "1150.25"]
      - ["PIEDPIPER", "340.00"]

