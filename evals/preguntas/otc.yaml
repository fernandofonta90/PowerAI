- id: otc-aging-buckets
  cu: CU-00
  pregunta: "Dame el aging de la cartera por tramos de días de mora"
  variantes:
    - "¿Cómo se distribuye la cartera por antigüedad?"
  usuario: uploader.mx@powerai.dev
  respondible: true
  sql_canonico: >-
    SELECT CASE WHEN dias_vencido = 0 THEN 'corriente'
    WHEN dias_vencido <= 30 THEN '1-30' WHEN dias_vencido <= 60 THEN '31-60'
    ELSE '60+' END AS bucket, sum(monto) AS total FROM ar_abiertas
    GROUP BY bucket ORDER BY bucket
  asercion:
    filas:
      - ["1-30", "37330.25"]
      - ["31-60", "15850.75"]
      - ["60+", "23270.00"]
      - ["corriente", "22640.50"]

