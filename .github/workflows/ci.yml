name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sincronizar dependencias
        run: uv sync

      - name: Ruff (lint + formato)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: pytest
        # testcontainers usa el Docker disponible en el runner.
        run: uv run pytest

  evals:
    name: Banco de preguntas doradas (nivel motor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sincronizar dependencias
        run: uv sync

      - name: Evals nivel motor (umbral 100%)
        # Determinístico: cada pregunta dorada ejecuta su SQL canónico por el motor
        # y compara contra la aserción. Cualquier fallo rompe el build.
        run: uv run pytest tests/test_evals.py -q

  web:
    name: Web (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test

  docker:
    name: Imágenes Docker (build, sin publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build imagen API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: api
          push: false
          tags: powerai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen worker
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: worker
          push: false
          tags: powerai-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
