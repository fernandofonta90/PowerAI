[project]
name = "powerai-api"
version = "0.1.0"
description = "Backend FastAPI de PowerAI — SSC Finanzas LATAM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "azure-storage-blob>=12.20",
    "pyarrow>=16.1",
    "openpyxl>=3.1",
    # DuckDB con versión FIJA: el lockdown de seguridad del motor
    # (SET enable_external_access=false tras materializar las fuentes) está
    # validado contra esta versión. Los upgrades son deliberados, nunca
    # implícitos: revalidar el lockdown antes de subirla.
    "duckdb==1.5.3",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "celery.*", "pyarrow.*", "openpyxl.*", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
markers = [
    "integration: tests que requieren Postgres (testcontainers / Docker)",
]
