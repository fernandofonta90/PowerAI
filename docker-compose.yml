# Entorno de desarrollo local de PowerAI.
# Provisiona las dependencias de infraestructura de la Fase 1 (M1):
#   - PostgreSQL 16 con pgvector (base transaccional; ver ADR-0001/0002)
#   - Redis (broker/result backend para Celery; jobs fuera del request)
#   - Azurite (emulador local de Azure Blob Storage)
#
# Uso:  docker compose up -d
# Los datos reales del SSC NUNCA se versionan; los volúmenes son locales.
#
# Profiles:
#   (default)        solo infraestructura: postgres, redis, azurite
#   --profile worker infra + worker Celery
#   --profile full   TODO contenedorizado: infra + api + worker

# Cadena de conexión de Azurite (clave pública y bien conocida del emulador).
x-blob-azurite: &blob_azurite >-
  DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: powerai-postgres
    environment:
      POSTGRES_USER: powerai
      POSTGRES_PASSWORD: powerai_dev
      POSTGRES_DB: powerai
    ports:
      # Puerto de host configurable para evitar choques con otros Postgres locales.
      - "${POWERAI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerai -d powerai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: powerai-redis
    ports:
      - "${POWERAI_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: powerai-azurite
    # --skipApiVersionCheck: el SDK de Azure suele usar una API version más
    # nueva que la soportada por Azurite; en dev se omite la verificación.
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck"
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite_data:/data

  # API contenedorizada. Solo en el profile "full"; el flujo dev por defecto
  # corre la API con uvicorn local (ver README).
  api:
    build:
      context: ./api
      target: api
    container_name: powerai-api
    profiles: ["full"]
    environment:
      POWERAI_DATABASE_URL: postgresql+psycopg://powerai:powerai_dev@postgres:5432/powerai
      POWERAI_REDIS_URL: redis://redis:6379/0
      POWERAI_CELERY_EAGER: "false"
      POWERAI_BLOB_CONNECTION_STRING: *blob_azurite
    ports:
      - "${POWERAI_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started

  # Worker Celery de ingesta (normalización a Parquet fuera del request).
  # Comparte imagen con la API (target worker). En los profiles "worker" y "full";
  # `docker compose up -d` (sin profile) solo levanta la infraestructura.
  worker:
    build:
      context: ./api
      target: worker
    container_name: powerai-worker
    profiles: ["worker", "full"]
    environment:
      POWERAI_DATABASE_URL: postgresql+psycopg://powerai:powerai_dev@postgres:5432/powerai
      POWERAI_REDIS_URL: redis://redis:6379/0
      POWERAI_BLOB_CONNECTION_STRING: *blob_azurite
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  postgres_data:
  azurite_data:
